<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="felt-weave">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="f"/>
    <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.65  0 0 0 0 0.60  0 0 0 0 0.52  0 0 0 0.05 0"/>
  </filter>
  <filter id="felt-speck">
    <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" seed="29" result="s"/>
    <feColorMatrix in="s" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.31  0 0 0 0.04 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#felt-weave)"/>
  <rect width="360" height="360" filter="url(#felt-speck)"/>
</svg>
