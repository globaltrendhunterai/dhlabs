<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #1E1B4B 0%, #0F0E2A 100%);
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 60px;
    overflow: hidden;
  }
  .top-brand {
    position: absolute;
    top: 140px;
    left: 80px;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .badge {
    background: #818CF8;
    color: #FFFFFF;
    font-size: 32px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 30px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: -1px;
  }
  p {
    font-size: 38px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }
  .footer-brand {
    position: absolute;
    bottom: 120px;
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="top-brand">AutoFlow Enterprise</div>
  <div class="badge">🔥 27~35초 공식 자사몰 전환</div>
  <h1>선착순 1년 50% 파운딩 특가<br/><span style="color:#FACC15;">연 59만 ➔ 295,000원!</span></h1>
  <p>월 24,500원 꼴 / 선착순 10개사 한정<br/>1년 내내 무중단으로 비즈니스를 지키세요</p>
  <div style="font-size:36px; font-weight:800; background:#2563EB; padding:22px 36px; border-radius:20px; color:#FFFFFF; margin-top:40px; box-shadow:0 10px 30px rgba(37,99,235,0.5);">👉 프로필 링크: autoflow.io</div>
  <div class="footer-brand">autoflow.io | 127ms 무인 자가치유</div>
</body>
</html>
