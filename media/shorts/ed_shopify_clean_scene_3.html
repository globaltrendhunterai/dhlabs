<!DOCTYPE html>

  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #064E3B 0%, #022C22 100%);

    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px;
    overflow: hidden;
    position: relative;
  }
  .brand-tag {
    position: absolute;

  }
  .domain-tag {
    position: absolute;
    bottom: 90px;
    font-size: 30px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="brand-tag">AUTOFLOW SHOPIFY DEFENDER</div>
  
      <div style="font-size:120px; filter:drop-shadow(0 0 40px #008060);">⚡ 🛡️ 🟢</div>
      <div style="font-size:38px; font-weight:800; color:#A7F3D0; letter-spacing:4px; margin-top:15px;">
        AUTOFLOW GUARDIAN
      </div>
      <div style="font-size:110px; font-weight:900; color:#34D399; margin-top:10px; font-family:monospace; text-shadow:0 0 30px #008060;">
        127 ms
      </div>
      <div style="background:#064E3B; border:3px solid #10B981; border-radius:24px; padding:20px 50px; font-size:42px; font-weight:800; color:#FFFFFF; margin-top:20px; box-shadow:0 0 30px rgba(16,185,129,0.3);">
        SHOPIFY API: <span style="color:#6EE7B7;">HEALED & SYNCED ✅</span>
      </div>
    
  
  <div class="domain-tag">https://autoflow.io</div>

</html>
