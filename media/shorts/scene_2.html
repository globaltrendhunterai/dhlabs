<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #78350F 0%, #291500 100%);
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 60px;
    overflow: hidden;
  }
  .top-brand {
    position: absolute;
    top: 140px;
    left: 80px;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .badge {
    background: #F59E0B;
    color: #FFFFFF;
    font-size: 32px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 30px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: -1px;
  }
  p {
    font-size: 38px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }
  .footer-brand {
    position: absolute;
    bottom: 120px;
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="top-brand">AutoFlow Enterprise</div>
  <div class="badge">📉 3~15초 고통 극대화</div>
  <h1>외주 개발자 부르면 30만원...<br/><span style="color:#F87171;">방치하면 매출과 평점 증발!</span></h1>
  <p>고객 클레임에 배송 지연 패널티까지 맞습니다<br/>자동화가 멈추면 사업도 멈춥니다</p>
  <div style="font-size:34px; background:rgba(0,0,0,0.4); padding:20px 32px; border-radius:16px; border:2px solid #F59E0B; color:#FDE68A; margin-top:40px;">💸 주문 누락 손실 + 복구 인건비 폭탄</div>
  <div class="footer-brand">autoflow.io | 127ms 무인 자가치유</div>
</body>
</html>
