<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #064E3B 0%, #022C22 100%);
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 60px;
    overflow: hidden;
  }
  .top-brand {
    position: absolute;
    top: 140px;
    left: 80px;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .badge {
    background: #10B981;
    color: #FFFFFF;
    font-size: 32px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 30px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: -1px;
  }
  p {
    font-size: 38px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }
  .footer-brand {
    position: absolute;
    bottom: 120px;
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="top-brand">AutoFlow Enterprise</div>
  <div class="badge">⚡ 15~27초 해결책 시연</div>
  <h1>AutoFlow 127ms 자가치유 데몬<br/><span style="color:#34D399;">서버가 죽어도 스스로 소생!</span></h1>
  <p>3대 에어백 완제품 코딩 없이 더블클릭 가동<br/>새벽에도 대표님은 꿀잠 잘 수 있습니다</p>
  <div style="font-size:34px; background:rgba(0,0,0,0.4); padding:20px 32px; border-radius:16px; border:2px solid #10B981; color:#A7F3D0; margin-top:40px;">🛡️ 127ms 무인 크래시 소생 가드 가동</div>
  <div class="footer-brand">autoflow.io | 127ms 무인 자가치유</div>
</body>
</html>
