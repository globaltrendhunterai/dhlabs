<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #7F1D1D 0%, #450A0A 100%);
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px 60px;
    overflow: hidden;
  }
  .top-brand {
    position: absolute;
    top: 140px;
    left: 80px;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .badge {
    background: #EF4444;
    color: #FFFFFF;
    font-size: 32px;
    font-weight: 800;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 50px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.25;
    margin-bottom: 30px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    letter-spacing: -1px;
  }
  p {
    font-size: 38px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
  }
  .footer-brand {
    position: absolute;
    bottom: 120px;
    font-size: 28px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>
  <div class="top-brand">AutoFlow Enterprise</div>
  <div class="badge">🚨 0~3초 긴급 경고</div>
  <h1>자고 일어났더니<br/><span style="color:#FACC15;">쿠팡 주문 50건 증발?!</span></h1>
  <p>새벽 3시 자동화 서버 다운, 대표님은 모릅니다</p>
  <div style="font-size:32px; background:rgba(0,0,0,0.4); padding:16px 28px; border-radius:16px; border:2px dashed #EF4444; color:#FCA5A5; margin-top:40px;">⚠️ CoupangApiRateLimit: 429 Too Many Requests</div>
  <div class="footer-brand">autoflow.io | 127ms 무인 자가치유</div>
</body>
</html>
