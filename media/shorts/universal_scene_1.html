<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; }
  body {
    width: 1080px;
    height: 1920px;
    background: linear-gradient(180deg, #991B1B 0%, #450A0A 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px;
    overflow: hidden;
  }
  .brand-tag {
    position: absolute;
    top: 120px;
    font-size: 36px;
    font-weight: 800;
    color: rgba(255,255,255,0.4);
    letter-spacing: 4px;
  }
  .domain-tag {
    position: absolute;
    bottom: 100px;
    font-size: 32px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="brand-tag">AUTOFLOW SRE DEFENDER</div>
  
      <div style="font-size:140px; filter:drop-shadow(0 0 40px #EF4444); animation:shake 0.5s infinite;">🚨</div>
      <div style="font-size:110px; font-weight:900; color:#FFFFFF; margin-top:20px; letter-spacing:2px;">03:14 AM</div>
      <div style="font-size:80px; font-weight:900; color:#EF4444; background:rgba(0,0,0,0.6); padding:20px 48px; border-radius:24px; border:4px solid #EF4444; margin-top:30px;">
        ⚠️ 429 ERROR
      </div>
      <div style="font-size:50px; color:#FCA5A5; font-weight:700; margin-top:30px;">
        ORDERS: <span style="color:#EF4444; text-decoration:line-through;">50</span> ➔ 0 ❌
      </div>
    
  <div class="domain-tag">https://autoflow.io</div>
</body>
</html>
